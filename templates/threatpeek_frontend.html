
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>ThreatPeek URL Scanner</title>

    <link rel="stylesheet" href="/static/styles.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f9f9f9;
        }
        #container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button {
            padding: 10px;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
        }
        #result {
            margin-top: 20px;
        }
        .status {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <h2>ThreatPeek PH - URL Scanner</h2>
        <!-- Input field for URL -->
        <input type="text" id="urlInput" placeholder="Enter URL to scan (e.g. https://example.com)" />
        <!-- Button to trigger scan -->
        <button onclick="scanUrl()">Scan URL</button>
        <!-- Result will be displayed here -->
        <div id="result"></div>
    </div>

    <script>
        // Function to scan the URL using the ThreatPeek backend
        async function scanUrl() {
            const url = document.getElementById("urlInput").value;
            const resultDiv = document.getElementById("result");

            // Clear previous result
            resultDiv.innerHTML = "Scanning...";

            try {
                const response = await fetch("/api/scan_url", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                // Display the result of the scan
                resultDiv.innerHTML = `
                    <p><span class="status">Status:</span> ${data.status}</p>
                    <p><span class="status">Details:</span> ${data.details}</p>
                `;
            } catch (error) {
                // Display error if fetch fails
                resultDiv.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
